{{define "content"}}
<main class="app">
	<h1>Dagens anteckning</h1>
	<p class="note-date">{{.date}}</p>
	{{with .note}}
	<section class="note{{if .Important}} note-important{{end}}"{{if .Important}} role="alert"{{end}}>
		{{if .Important}}<p class="note-flag">Viktigt</p>{{end}}
		<div class="note-text note-markdown">{{$.noteHTML}}</div>
	</section>
	{{else}}
	<section class="note note-empty">
		<p class="note-text">Inga särskilda instruktioner idag. Allt är som vanligt!</p>
	</section>
	{{end}}
	{{with .confirmation}}<p class="ack-confirmation" role="status">✓ {{.}}</p>{{end}}
	<form method="post" action="/note/ack" class="ack-form">
		<label for="ack-name" class="ack-label">Förnamn (valfritt)</label>
		<input type="text" name="name" id="ack-name" class="ack-name" maxlength="{{.maxNameLen}}" autocomplete="given-name" />
		<button type="submit" class="ack-submit">Kvittera</button>
	</form>
</main>
{{end}}
