<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="favHaloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="favBubbleLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="favBubbleDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <style>
      .fav-card { fill: url(#favBubbleLight); }
      .fav-line-1 { stroke: #ffffff; }
      .fav-line-2 { stroke: #38bdf8; }
      @media (prefers-color-scheme: dark) {
        .fav-card { fill: url(#favBubbleDark); }
        .fav-line-1 { stroke: #ffffff; }
        .fav-line-2 { stroke: #fbbf24; }
      }
    </style>
  </defs>

  <!-- Halo glow -->
  <ellipse cx="32" cy="13" rx="20" ry="7" fill="url(#favHaloGlow)" />

  <!-- Halo ring -->
  <ellipse cx="32" cy="13" rx="16" ry="5" fill="none" stroke="#f59e0b" stroke-width="3" />

  <!-- Note Card / Bubble -->
  <rect class="fav-card" x="12" y="20" width="40" height="34" rx="8" />

  <!-- Note Lines -->
  <line class="fav-line-1" x1="20" y1="30" x2="44" y2="30" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9"/>
  <line class="fav-line-1" x1="20" y1="37" x2="38" y2="37" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8"/>
  <line class="fav-line-2" x1="20" y1="44" x2="28" y2="44" stroke-width="2.5" stroke-linecap="round"/>
</svg>
