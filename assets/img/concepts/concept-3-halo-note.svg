<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Halo soft glow background -->
  <ellipse cx="150" cy="46" rx="48" ry="16" fill="url(#haloGlow)" />

  <!-- Halo ring -->
  <ellipse cx="150" cy="46" rx="42" ry="12" fill="none" stroke="#f59e0b" stroke-width="6" />

  <!-- Note / Message Bubble -->
  <path d="M 120 70 L 180 70 C 196 70 208 82 208 98 L 208 116 C 208 132 196 144 180 144 L 146 144 L 132 156 L 132 144 L 120 144 C 104 144 92 132 92 116 L 92 98 C 92 82 104 70 120 70 Z"
        fill="url(#bubbleGrad)" />

  <!-- Folded corner / note line inside bubble -->
  <path d="M 112 94 L 168 94" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round" />
  <path d="M 112 108 L 152 108" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round" />
  <path d="M 112 122 L 138 122" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- Typography -->
  <text x="150" y="196" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#0f172a" letter-spacing="0.05em">ANGEL</text>
  <text x="150" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b" letter-spacing="0.08em">DAGENS ANTECKNING</text>
</svg>
