<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="wingGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="wingGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <style>
      .logo-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: 0.05em; }
      .logo-subtitle { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; }
      @media (prefers-color-scheme: dark) {
        .logo-title { fill: #f8fafc; }
        .logo-subtitle { fill: #94a3b8; }
      }
    </style>
  </defs>

  <!-- Central head / sun dot -->
  <circle cx="150" cy="52" r="14" fill="#f59e0b" />

  <!-- Arch / sheltering body -->
  <path d="M 124 126 C 124 88 176 88 176 126" fill="none" stroke="url(#archGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Left Wing -->
  <path d="M 126 80 C 100 62 64 68 46 88 C 66 88 88 94 104 104 C 84 104 68 114 56 128 C 76 122 96 122 116 124 C 104 132 94 144 88 156 C 106 146 124 138 140 134"
        fill="url(#wingGradLeft)" />

  <!-- Right Wing -->
  <path d="M 174 80 C 200 62 236 68 254 88 C 234 88 212 94 196 104 C 216 104 232 114 244 128 C 224 122 204 122 184 124 C 196 132 206 144 212 156 C 194 146 176 138 160 134"
        fill="url(#wingGradRight)" />

  <!-- Typography -->
  <text x="150" y="200" text-anchor="middle" class="logo-title">ANGEL</text>
  <text x="150" y="222" text-anchor="middle" class="logo-subtitle">OMSORG &amp; KOMMUNIKATION</text>
</svg>
