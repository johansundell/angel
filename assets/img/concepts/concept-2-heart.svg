<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="wingAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <style>
      .logo-title { fill: #0f766e; font-family: system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: 0.04em; }
      .logo-subtitle { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; }
      @media (prefers-color-scheme: dark) {
        .logo-title { fill: #2dd4bf; }
        .logo-subtitle { fill: #94a3b8; }
      }
    </style>
  </defs>

  <!-- Central Heart shape -->
  <path d="M 150 144 C 110 108 90 82 108 56 C 126 30 148 46 150 62 C 152 46 174 30 192 56 C 210 82 190 108 150 144 Z"
        fill="none" stroke="url(#heartGrad)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Left Wing feathers extending from heart -->
  <path d="M 112 88 C 84 74 44 80 32 100 C 50 104 74 104 94 116"
        fill="none" stroke="url(#heartGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M 98 116 C 78 114 48 120 42 136 C 60 138 82 134 100 138"
        fill="none" stroke="url(#wingAccent)" stroke-width="5" stroke-linecap="round" />

  <!-- Right Wing feathers extending from heart -->
  <path d="M 188 88 C 216 74 256 80 268 100 C 250 104 226 104 206 116"
        fill="none" stroke="url(#heartGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M 202 116 C 222 114 252 120 258 136 C 240 138 218 134 200 138"
        fill="none" stroke="url(#wingAccent)" stroke-width="5" stroke-linecap="round" />

  <!-- Typography -->
  <text x="150" y="196" text-anchor="middle" class="logo-title">Angel</text>
  <text x="150" y="218" text-anchor="middle" class="logo-subtitle">HEMTJÄNST &amp; OMSORG</text>
</svg>
