<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <radialGradient id="logoHaloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoCardGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="logoCardGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <style>
      .logo-emblem-card { fill: url(#logoCardGradLight); }
      .logo-text-title { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; font-size: 34px; font-weight: 700; letter-spacing: 0.04em; }
      .logo-text-sub { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
      @media (prefers-color-scheme: dark) {
        .logo-emblem-card { fill: url(#logoCardGradDark); stroke: #475569; stroke-width: 1; }
        .logo-text-title { fill: #f8fafc; }
        .logo-text-sub { fill: #94a3b8; }
      }
    </style>
  </defs>

  <!-- Emblem Left (Icon) -->
  <g transform="translate(10, 4)">
    <!-- Halo glow -->
    <ellipse cx="34" cy="14" rx="24" ry="8" fill="url(#logoHaloGlow)" />
    <!-- Halo ring -->
    <ellipse cx="34" cy="14" rx="20" ry="6" fill="none" stroke="#f59e0b" stroke-width="3.5" />
    <!-- Note bubble -->
    <path class="logo-emblem-card" d="M 12 24 L 56 24 C 61 24 65 28 65 33 L 65 57 C 65 62 61 66 56 66 L 30 66 L 22 73 L 22 66 L 12 66 C 7 66 3 62 3 57 L 3 33 C 3 28 7 24 12 24 Z" />
    <!-- Lines inside note -->
    <line x1="15" y1="38" x2="53" y2="38" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="15" y1="46" x2="43" y2="46" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
    <line x1="15" y1="54" x2="31" y2="54" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography Right -->
  <text x="96" y="47" class="logo-text-title">Angel</text>
  <text x="98" y="65" class="logo-text-sub">Hemtjänst &amp; Omsorg</text>
</svg>
