<!DOCTYPE html>
<html lang="sv">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="light dark" />
	<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
	<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
	<link rel="stylesheet" href="/assets/css/main.css" />
	<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
	<link rel="icon" type="image/png" href="/assets/img/favicon.png" />
	<title>Angel – Ingen anslutning</title>
</head>

<body>
	<!-- The service worker shows this page when a page can't be loaded. It is
	stored on the device, so it must say nothing about the Client or a note. -->
	<main class="app entry">
		<img src="/assets/img/logo.svg" alt="Angel" class="entry-logo" width="180" height="45" />
		<p class="offline-message">Ingen anslutning. Anteckningen kan inte visas utan internet.</p>
		<button type="button" class="pin-submit offline-retry" onclick="location.reload()">Försök igen</button>
	</main>
</body>

</html>
