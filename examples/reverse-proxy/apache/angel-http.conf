# Port 80 for Angel behind Apache: answers Let's Encrypt challenges and sends
# everything else to HTTPS. Enable it before angel.conf, because certbot needs
# it to get the certificate that angel.conf uses (see ../README.md).
#
# On Debian/Ubuntu: copy to /etc/apache2/sites-available/angel-http.conf, then
#   a2ensite angel-http
#   systemctl reload apache2
# Lines after a CHANGE comment need your values.

<VirtualHost *:80>
    # CHANGE
    ServerName angel.example.com

    # certbot certonly --webroot -w /var/www/letsencrypt
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    # CHANGE the host name
    RedirectMatch permanent ^/(?!\.well-known/acme-challenge/)(.*)$ https://angel.example.com/$1
</VirtualHost>
