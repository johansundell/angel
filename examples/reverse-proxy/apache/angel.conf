# Angel behind Apache over HTTPS, with a Let's Encrypt certificate. Needs
# angel-http.conf for port 80 and certificate renewals; enable that first and
# get the certificate (see ../README.md).
#
# On Debian/Ubuntu: copy this file to /etc/apache2/sites-available/angel.conf
# and angel-proxy.conf to /etc/apache2/angel-proxy.conf, then
#   a2enmod proxy proxy_http headers ssl
#   a2ensite angel
#   systemctl reload apache2
# Lines after a CHANGE comment need your values. Run Angel on the same host
# with PORT=127.0.0.1:8080 and TRUSTED_PROXIES=127.0.0.1.
#
# Apache has no built-in rate limit for /pin; Angel's own limit (5 wrong PINs
# per address per 15 minutes) applies either way.

<VirtualHost *:443>
    # CHANGE
    ServerName angel.example.com

    SSLEngine on
    # CHANGE both paths
    SSLCertificateFile    /etc/letsencrypt/live/angel.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/angel.example.com/privkey.pem

    Include /etc/apache2/angel-proxy.conf
    # CHANGE if Angel listens elsewhere
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
