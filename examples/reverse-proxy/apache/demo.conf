# The demo's configuration (compose.yml): loads the modules the official httpd
# image leaves off, then a plain-HTTP VirtualHost whose upstream is the angel
# container. The proxy rules are the same as angel.conf.
<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>
<IfModule !headers_module>
    LoadModule headers_module modules/mod_headers.so
</IfModule>

ServerName localhost

<VirtualHost *:80>
    Include conf/extra/angel-proxy.conf
    ProxyPass        / http://angel:8080/
    ProxyPassReverse / http://angel:8080/
</VirtualHost>
