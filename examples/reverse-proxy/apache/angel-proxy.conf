# Proxy rules shared by angel.conf and demo.conf. Include it inside the
# VirtualHost, next to ProxyPass. Needs mod_proxy, mod_proxy_http and
# mod_headers.

ProxyPreserveHost On

# Angel counts failed PINs per client address, taken from X-Forwarded-For when
# the request comes from an address in TRUSTED_PROXIES. By default Apache
# appends the client's address to whatever X-Forwarded-For the client sent.
# Angel copes with that (it reads the header from the right), but replacing
# the header keeps it to the one address Apache saw.
ProxyAddHeaders Off
RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"

# Security headers. Browsers ignore HSTS over plain HTTP, so it does nothing in
# the demo.
Header always set Strict-Transport-Security "max-age=31536000"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"
Header always set X-Frame-Options "DENY"

# Notes are short; Angel itself rejects logged bodies over 1 MiB.
LimitRequestBody 1048576
