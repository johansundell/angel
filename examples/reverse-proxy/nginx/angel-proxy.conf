# Proxy rules shared by angel.conf and demo.conf. Include it inside a
# location block, next to proxy_pass.

proxy_http_version 1.1;
proxy_set_header Host $host;
# Angel counts failed PINs per client address, taken from X-Forwarded-For when
# the request comes from an address in TRUSTED_PROXIES. Replace whatever the
# client sent with the address nginx saw. Never pass $http_x_forwarded_for on
# its own: then the client picks its own address.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Security headers. nginx drops add_header lines from outer blocks when a
# location has its own, so they all live here. Browsers ignore HSTS over plain
# HTTP, so it does nothing in the demo.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
