# Demo: Angel behind nginx on http://localhost:8080. Run from this folder:
#   docker compose up --build
# Angel is not published, so the only way in is through nginx.
services:
  angel:
    build:
      context: ../../..
    environment:
      # Demo only: put real PINs in .env (see ../README.md).
      CAREGIVER_PIN: "1234"
      MASTER_PIN: "987654"
      # Only nginx may set X-Forwarded-For.
      TRUSTED_PROXIES: 172.30.0.10
    networks:
      proxy:
        ipv4_address: 172.30.0.20

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./demo.conf:/etc/nginx/conf.d/default.conf:ro
      - ./angel-proxy.conf:/etc/nginx/snippets/angel-proxy.conf:ro
    depends_on:
      angel:
        condition: service_healthy
    networks:
      proxy:
        ipv4_address: 172.30.0.10

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.0.0/24
