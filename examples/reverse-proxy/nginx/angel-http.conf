# Port 80 for Angel behind nginx: answers Let's Encrypt challenges and sends
# everything else to HTTPS. Install it before angel.conf, because certbot needs
# it to get the certificate that angel.conf uses (see ../README.md).
#
# Copy to /etc/nginx/conf.d/angel-http.conf (or sites-available/ and link it
# from sites-enabled/). Lines marked CHANGE need your values.

server {
    listen 80;
    listen [::]:80;
    server_name angel.example.com;  # CHANGE

    # certbot certonly --webroot -w /var/www/letsencrypt
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
