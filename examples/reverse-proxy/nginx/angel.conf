# Angel behind nginx over HTTPS, with a Let's Encrypt certificate. Needs
# angel-http.conf for port 80 and certificate renewals; install that first
# and get the certificate (see ../README.md).
#
# Copy this file to /etc/nginx/conf.d/angel.conf (or sites-available/ and
# link it from sites-enabled/), and angel-proxy.conf to
# /etc/nginx/snippets/angel-proxy.conf. Lines marked CHANGE need your values.
# Run Angel on the same host with PORT=127.0.0.1:8080 and
# TRUSTED_PROXIES=127.0.0.1.

# Optional second limit on PIN guesses, on top of Angel's own (5 wrong PINs per
# address per 15 minutes). Uncomment this and the "location = /pin" block below.
# limit_req_zone $binary_remote_addr zone=angel_pin:1m rate=10r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name angel.example.com;  # CHANGE

    ssl_certificate     /etc/letsencrypt/live/angel.example.com/fullchain.pem;  # CHANGE
    ssl_certificate_key /etc/letsencrypt/live/angel.example.com/privkey.pem;    # CHANGE

    # Notes are short; Angel itself rejects logged bodies over 1 MiB.
    client_max_body_size 1m;

    location / {
        include snippets/angel-proxy.conf;
        proxy_pass http://127.0.0.1:8080;  # CHANGE if Angel listens elsewhere
    }

    # location = /pin {
    #     limit_req zone=angel_pin burst=5 nodelay;
    #     limit_req_status 429;
    #     include snippets/angel-proxy.conf;
    #     proxy_pass http://127.0.0.1:8080;
    # }
}
