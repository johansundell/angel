# Runs the image against the local .env and SQLite database instead of the
# named volume in docker-compose.yml. Start it with `make docker-run-local`:
# it passes your uid and gid, creates the data folder as you, and stops when
# .env is missing. Run directly, Docker creates a missing .env or data folder
# as an empty root-owned directory.
services:
  angel:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    # Your own user, so SQLite can write the database files in your data
    # folder; the image's appuser would get "permission denied".
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      # The service loads .env from next to its binary. Variables set below or
      # in the image (PORT=:8080) win over the same keys in .env.
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
      # The folder, not the file: SQLite writes -wal and -shm files beside it.
      - type: bind
        source: ${LOCAL_DATA_DIR:-./data}
        target: /app/data
    environment:
      # The SQLITE_PATH in .env is a host path; this is the same file in the
      # container.
      - SQLITE_PATH=/app/data/angel.db
    extra_hosts:
      # Lets MYSQL_HOST=host.docker.internal reach a MySQL server on the host.
      - "host.docker.internal:host-gateway"
