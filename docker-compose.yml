services:
  angel:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    ports:
      # The container listens on 8080 (set in the Dockerfile); pick the host
      # port with HOST_PORT, e.g. HOST_PORT=9090 docker compose up
      - "${HOST_PORT:-8080}:8080"
    volumes:
      # Named volume: Docker creates it owned like the image's /app/data, so
      # the non-root container user can write it on any host. A host folder
      # (./data) would usually belong to another uid and fail with
      # "permission denied".
      - data:/app/data
    environment:
      - USE_FILE_SYSTEM=false
      - SQLITE_PATH=/app/data/angel.db
      - DEBUG=false
      # Passed through from the host environment or an .env file next to
      # this file; the service refuses to start without them.
      - CAREGIVER_PIN
      - MASTER_PIN
      - SESSION_SECRET
      # Optional; unset uses the defaults (20m and 8h).
      - CAREGIVER_SESSION_TIMEOUT
      - CLIENT_SESSION_TIMEOUT
      # Optional; true shows Caregivers each other's first names.
      - SHARE_CAREGIVER_NAMES
    restart: unless-stopped

volumes:
  data:
